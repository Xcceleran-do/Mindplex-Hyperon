version: '3.8'
services:
  neo4j:
    image: neo4j:5.11
    container_name: content_optimizer_neo4j
    environment:
      - NEO4J_AUTH=neo4j/yourpassword
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/cypher:/var/lib/neo4j/cypher
      - ./infra/neo4j/neo4j.conf:/var/lib/neo4j/conf/neo4j.conf

  backend:
    image: python:3.10-slim
    container_name: content_optimizer_backend_placeholder
    command: ["sleep", "infinity"]
    volumes:
      - ./:/workspace
    working_dir: /workspace
