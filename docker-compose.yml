services:
  mining-api:
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://ftp.us.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://security.debian.org/debian-security}
    env_file: .env
    environment:
      FLASK_DEBUG: "0"
      INGESTION_ENABLED: "${INGESTION_ENABLED:-true}"
      INGESTION_CACHE_TTL_DAYS: "${INGESTION_CACHE_TTL_DAYS:-3}"
      METADATA_EXTRACTOR_BASE_URL: "${METADATA_EXTRACTOR_BASE_URL:-http://127.0.0.1:8080}"
      METADATA_EXTRACTOR_API_KEY: "${METADATA_EXTRACTOR_API_KEY:-}"
      METADATA_EXTRACTOR_NAMESPACE: "${METADATA_EXTRACTOR_NAMESPACE:-A}"
      METADATA_EXTRACTOR_TIMEOUT_SECONDS: "${METADATA_EXTRACTOR_TIMEOUT_SECONDS:-150}"
      METADATA_EXTRACTOR_CHUNK_SIZE: "${METADATA_EXTRACTOR_CHUNK_SIZE:-10}"
      METADATA_EXTRACTOR_USE_MODEL: "${METADATA_EXTRACTOR_USE_MODEL:-true}"
      METADATA_EXTRACTOR_REQUIRED_PROPERTIES: "${METADATA_EXTRACTOR_REQUIRED_PROPERTIES:-engagement,audience-expertise}"
      PETTA_DEBUG: "0"
      PETTA_CHAIN_DEPTH: "${PETTA_CHAIN_DEPTH:-3}"
      PETTA_MINING_TIMEOUT_SECONDS: "${PETTA_MINING_TIMEOUT_SECONDS:-90}"
      PETTA_MINING_MAX_OUTPUT_BYTES: "${PETTA_MINING_MAX_OUTPUT_BYTES:-8388608}"
      PETTA_CHAIN_TIMEOUT_SECONDS: "${PETTA_CHAIN_TIMEOUT_SECONDS:-90}"
      PETTACHAINER_BASE_URL: "${PETTACHAINER_BASE_URL:-http://127.0.0.1:8000}"
      PETTACHAINER_API_KEY: "${PETTACHAINER_API_KEY:-}"
      PETTACHAINER_KB_PREFIX: "${PETTACHAINER_KB_PREFIX:-mindplex}"
      MINDPLEX_API_DOMAIN: https://api-dev.mindplex.ai
      MINDPLEX_TOKEN_CACHE_PATH: /app/.mindplex-auth/tokens.json
    volumes:
      - ./.mindplex-auth:/app/.mindplex-auth
      - ingestion-data:/app/experiments/atomspace_visualizer/public
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=10).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    network_mode: host

  frontend:
    build:
      context: ./experiments/atomspace_visualizer
      args:
        VITE_API_BASE_URL: "http://localhost:5000"
        VITE_INGESTION_ENABLED: "${INGESTION_ENABLED:-true}"
        VITE_MAX_VIS_ARTICLES: "${VITE_MAX_VIS_ARTICLES:-1500}"
        VITE_DEFAULT_CHAIN_DEPTH: "${PETTA_CHAIN_DEPTH:-3}"
    depends_on:
      mining-api:
        condition: service_healthy
    ports:
      - "3001:80"

volumes:
  ingestion-data:
