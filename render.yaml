services:
  # Backend Service (Python/Flask)
  - type: web
    name: mindplex-backend
    env: python
    buildCommand: pip install -r experiments/requirements.txt
    startCommand: cd experiments && python mining_api.py
    envVars:
      - key: GEMINI_API_KEY4
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: "False"

  # Frontend Service (SolidJS/Vite)
  - type: static
    name: mindplex-frontend
    env: node
    buildCommand: cd experiments/atomspace_visualizer && npm install && npm run build
    staticPublishPath: experiments/atomspace_visualizer/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mindplex-backend
          property: url
